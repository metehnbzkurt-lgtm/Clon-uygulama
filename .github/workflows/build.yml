name: APK Derle
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q ./*.zip
      - name: Kod düzeltmesi
        run: sed -i 's/getComponentName(context)/ComponentName(context, AdminReceiver::class.java)/' KlonCalistirici/app/src/main/java/com/oguzhn/klonlayici/AdminReceiver.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
          build-root-directory: KlonCalistirici
      - run: gradle assembleDebug --no-daemon
        working-directory: KlonCalistirici
      - uses: actions/upload-artifact@v4
        with:
          name: KlonCalistirici-debug
          path: KlonCalistirici/app/build/outputs/apk/debug/*.apk
